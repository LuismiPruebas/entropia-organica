<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Entropía Orgánica</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js" } }
  </script>
  <script>
    // Si algo impide arrancar, lo decimos en pantalla en vez de fallar en silencio.
    function bootError(msg) {
      var el = document.getElementById('boot-error');
      if (el) { el.textContent = msg; el.hidden = false; }
    }
    window.addEventListener('error', function (e) { bootError('ERROR: ' + (e.message || e)); });
    window.addEventListener('DOMContentLoaded', function () {
      if (location.protocol === 'file:') {
        bootError('Abre el juego con el servidor: ejecuta "npm start" y entra en http://localhost:8080');
      }
      setTimeout(function () {
        if (!window.game && location.protocol !== 'file:') bootError('El juego no ha podido cargar. Mira la consola (F12).');
      }, 4000);
    });
  </script>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div id="organs"><canvas id="organs-glow" width="150" height="40"></canvas><canvas id="organs-c" width="150" height="40"></canvas></div>
      <div id="hud-tip" hidden></div>
      <div id="boss-bar" hidden><span></span><div class="bar"><i class="fill"></i></div></div>
    </div>

    <div id="message"></div>
    <div id="dialogue" hidden><div class="who"></div><div class="txt"></div><div class="next"></div></div>
    <div id="bark" hidden><div class="who"></div><div class="txt"></div></div>
    <div id="prompt"></div>
    <div id="node-menu" hidden></div>
    <div id="genome" hidden></div>
    <div id="dev-menu" hidden></div>

    <div id="overlay" class="cover">
      <div class="cover-top">
        <h1>ENTROPIA ORGANICA</h1>
        <p class="sub">No es solo una dimensión. Es tu cuerpo ahora.</p>
      </div>
      <div class="cover-bottom">
        <button id="controls-btn" type="button">CONTROLES <span class="dim">[E]</span></button>
        <p class="blink">HAZ CLIC PARA DESPERTAR</p>
        <p id="boot-error" hidden></p>
      </div>
    </div>

    <div id="fade"></div>
  </div>
  <button id="fullscreen" title="Pantalla completa (tecla P)">⛶</button>
  <script type="module" src="src/main.js"></script>
</body>
</html>
